version: 2

models:
  - name: int_wremotely__job_publication_status
    description: >
      Current publication eligibility and reason for every candidate. This keeps
      classification suppression distinct from confirmed lifecycle closure.
    columns:
      - name: candidate_id
        data_tests:
          - unique
          - not_null
      - name: publication_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PUBLISHABLE', 'CLOSED', 'NOT_PUBLISHABLE']
      - name: publication_status_reason
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - PUBLICATION_READY
                  - NOT_JOB
                  - WORK_ARRANGEMENT
                  - COUNTRY_ELIGIBILITY_SCOPE
                  - COUNTRY_ELIGIBILITY_VALUES
                  - MISSING_TITLE
                  - UNSUPPORTED_LANGUAGE
                  - LIFECYCLE_CLOSED
                  - LIFECYCLE_TERMINAL_CONFIRMED
                  - EXPIRED_VALID_THROUGH
      - name: has_expired_valid_through
        description: >
          Whether the source-declared validity boundary has elapsed. Date-only
          values remain valid through that UTC calendar date; timestamp values
          use their exact instant.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

  - name: int_wremotely__latest_selected_job_urls
    description: Latest selected job URL row for each candidate_id.
    columns:
      - name: candidate_id
        data_tests:
          - unique
          - not_null
      - name: url
        data_tests:
          - not_null
      - name: latest_selected_at
        data_tests:
          - not_null
      - name: latest_selection_stage_run_id
        data_tests:
          - not_null
      - name: latest_selection_run_id
        data_tests:
          - not_null
      - name: source_updated_at
        data_tests:
          - not_null
      - name: dbt_updated_at
        data_tests:
          - not_null

  - name: int_wremotely__latest_extraction_page_results
    description: Latest page retrieval and parser result for each candidate_id.
    columns:
      - name: candidate_id
        data_tests:
          - unique
          - not_null
      - name: url
        data_tests:
          - not_null
      - name: latest_page_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SUCCEEDED', 'FAILED']
      - name: latest_extraction_stage_run_id
        data_tests:
          - not_null
      - name: latest_extraction_run_id
        data_tests:
          - not_null
      - name: source_updated_at
        data_tests:
          - not_null
      - name: dbt_updated_at
        data_tests:
          - not_null

  - name: int_wremotely__latest_job_facts
    description: Latest extracted job facts for each candidate_id.
    columns:
      - name: candidate_id
        data_tests:
          - unique
          - not_null
      - name: url
        data_tests:
          - not_null
      - name: latest_job_fact_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['EXTRACTED', 'SKIPPED_EXTRACTION_FAILED']
      - name: latest_job_fact_extracted_at
        data_tests:
          - not_null
      - name: latest_job_fact_record_updated_at
        data_tests:
          - not_null
      - name: latest_job_fact_stage_run_id
        data_tests:
          - not_null
      - name: latest_job_facts_run_id
        data_tests:
          - not_null
      - name: source_updated_at
        data_tests:
          - not_null
      - name: dbt_updated_at
        data_tests:
          - not_null

  - name: int_wremotely__candidate_job_titles
    description: >
      One bounded trustworthy title per candidate, chosen from typed page
      metadata before an explicitly accepted crawl-link title candidate.
      Historic rows created before typed crawl-title evidence may use link text
      only when all new producer fields are absent and the value is bounded.
      Unbounded link text and generic HTML document titles are not promoted.
    columns:
      - name: candidate_id
        data_tests:
          - unique
          - not_null
      - name: title
        description: Nullable title; missing trustworthy evidence fails publication closed.
      - name: title_source
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - JSONLD
                  - HTML_META_OG_TITLE
                  - HTML_META_TWITTER_TITLE
                  - LINK_TITLE_CANDIDATE
                  - LEGACY_BOUNDED_LINK_TEXT

  - name: int_wremotely__latest_classifications
    description: Latest classification result for each candidate_id.
    columns:
      - name: candidate_id
        data_tests:
          - unique
          - not_null
      - name: url
        data_tests:
          - not_null
      - name: latest_classification_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CLASSIFIED', 'NEEDS_REVIEW', 'QUARANTINED']
      - name: latest_job_posting_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['JOB', 'NON_JOB', 'UNKNOWN']
      - name: latest_remote_scope
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['REMOTE', 'HYBRID', 'ONSITE', 'UNKNOWN']
      - name: latest_country_eligibility_scope
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['GLOBAL', 'GLOBAL_EXCEPT', 'SPECIFIC', 'UNKNOWN']
      - name: latest_serving_decision
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PUBLISHABLE', 'NOT_PUBLISHABLE', 'NEEDS_REVIEW', 'QUARANTINE']
      - name: latest_classification_stage_run_id
        data_tests:
          - not_null
      - name: latest_classification_run_id
        data_tests:
          - not_null
      - name: source_updated_at
        data_tests:
          - not_null
      - name: dbt_updated_at
        data_tests:
          - not_null

  - name: int_wremotely__latest_lifecycle_rechecks
    description: Latest explicit lifecycle recheck result for each candidate_id.
    columns:
      - name: candidate_id
        data_tests:
          - unique
          - not_null
      - name: url
        data_tests:
          - not_null
      - name: latest_lifecycle_page_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SUCCEEDED', 'FAILED']
      - name: latest_lifecycle_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CLOSED', 'REACHABLE', 'TERMINAL', 'UNKNOWN']
      - name: previous_lifecycle_status
        description: Prior lifecycle result used to require repeated terminal evidence.
      - name: latest_lifecycle_signal
        data_tests:
          - not_null
      - name: latest_lifecycle_stage_run_id
        data_tests:
          - not_null
      - name: latest_lifecycle_recheck_run_id
        data_tests:
          - not_null
      - name: source_updated_at
        data_tests:
          - not_null
      - name: dbt_updated_at
        data_tests:
          - not_null

  - name: int_wremotely__current_candidate_facts
    description: >
      Current joined candidate facts from the latest discovery, extraction,
      classification, and lifecycle rows.
    columns:
      - name: candidate_id
        data_tests:
          - unique
          - not_null
      - name: url
        data_tests:
          - not_null
      - name: title_source
        description: Trustworthy typed evidence source selected for title.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - JSONLD
                  - HTML_META_OG_TITLE
                  - HTML_META_TWITTER_TITLE
                  - LINK_TITLE_CANDIDATE
                  - LEGACY_BOUNDED_LINK_TEXT
      - name: job_identity_url
        description: >
          Validated job identity URL, falling back to the originally selected
          job URL when historic producer evidence is unavailable.
        data_tests:
          - not_null
      - name: final_url_identity_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - MISSING
                  - INVALID_REDIRECT
                  - REQUESTED_JOB_URL
                  - REDIRECTED_JOB_URL
                  - UNUSABLE_REDIRECT
                  - SELECTED_JOB_URL_FALLBACK
      - name: has_extraction
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: has_job_facts
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: has_selection
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: has_classification
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: has_lifecycle_recheck
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: has_country_eligibility_evidence
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: source_updated_at
        data_tests:
          - not_null
      - name: dbt_updated_at
        data_tests:
          - not_null

  - name: int_wremotely__country_eligibility_evidence
    description: >
      Country eligibility evidence from the matching latest classification run,
      mapped to unambiguous country and group taxonomy aliases when possible.
      Structured atomic fields require a complete alias match; bounded text may
      contain aliases. Unknown, invalid, ambiguous, and unmatched evidence stays
      visible for QA/RCA rather than being silently promoted. Structured country
      fields disambiguate aliases whose conflicting subcountry usage dominates
      supporting country usage, but never create applicant-eligibility evidence.
      Unmatched heuristic Remote/Hybrid/Onsite location labels remain UNKNOWN
      rather than blocking publication; recognized taxonomy matches from those
      labels remain restrictive. Onsite structured country or region locations
      may provide the default office country, while city-only values remain
      unknown.
    columns:
      - name: candidate_id
        data_tests:
          - not_null
      - name: classification_remote_scope
        description: Latest classification work arrangement used to gate onsite job-location evidence.
      - name: evidence_direction
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['INCLUDED', 'EXCLUDED', 'GLOBAL', 'UNKNOWN']
      - name: match_source
        data_tests:
          - not_null

  - name: int_wremotely__candidate_country_eligibility
    description: >
      Compact validated country eligibility facts at candidate grain. Explicit
      restrictive country evidence takes precedence over contradictory global
      prose so a broad claim cannot widen a bounded applicant requirement.
    columns:
      - name: candidate_id
        data_tests:
          - unique
          - not_null
      - name: validated_country_eligibility_scope
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['GLOBAL', 'GLOBAL_EXCEPT', 'SPECIFIC', 'UNKNOWN']
      - name: eligible_country_codes
        data_tests:
          - not_null
      - name: excluded_country_codes
        data_tests:
          - not_null
      - name: country_eligibility_evidence_count
        data_tests:
          - not_null

  - name: int_wremotely__job_country_eligibility
    description: >
      Compact job-country bridge for explicit eligibility and explicit
      exclusions. Global jobs are represented by the candidate/job scope instead
      of one row per country.
    columns:
      - name: job_id
        data_tests:
          - not_null
      - name: country_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('wremotely__countries')
                field: country_code
      - name: eligibility_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ELIGIBLE', 'EXCLUDED']

  - name: int_wremotely__publishable_job_facts
    description: >
      Current job facts eligible for the tested pre-publication candidate set.
      Private publication holds are applied only after dbt finishes.
    columns:
      - name: job_id
        data_tests:
          - unique
          - not_null
      - name: canonical_url
        data_tests:
          - not_null
      - name: source_url
        data_tests:
          - not_null
      - name: title
        data_tests:
          - not_null
      - name: company_id
        description: >
          Nullable stable company identifier. It is populated only when both a
          non-empty source company name and source domain are available.
      - name: company_identity_basis
        description: Nullable identity version used to derive company_id.
      - name: company_identity_key
        description: Internal deterministic identity key hashed into company_id.
      - name: normalized_company_name
        description: Internal normalized company name used only for identity derivation.
      - name: company_identity_source_domain
        description: Internal normalized source domain used only for identity derivation.
      - name: remote_scope
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['REMOTE', 'HYBRID', 'ONSITE']
      - name: raw_work_arrangement
        description: Raw structured or source-derived work arrangement evidence when available.
        data_tests:
          - accepted_values:
              arguments:
                values: ['REMOTE', 'HYBRID', 'ONSITE', 'UNKNOWN']
      - name: country_eligibility_scope
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['GLOBAL', 'GLOBAL_EXCEPT', 'SPECIFIC']
      - name: eligible_country_codes
        data_tests:
          - not_null
      - name: excluded_country_codes
        data_tests:
          - not_null
      - name: included_country_group_codes
        data_tests:
          - not_null
      - name: excluded_country_group_codes
        data_tests:
          - not_null
      - name: country_eligibility_evidence_count
        data_tests:
          - not_null
      - name: job_description
        description: Full extracted job description when available. This field is not truncated.
      - name: base_salary_json
        description: Source base salary payload as JSON when available.
      - name: estimated_salary_json
        description: Source estimated salary payload as JSON when available.
      - name: employment_type
        description: Source employment type when available.
      - name: declared_language_tag
        description: Source-declared language tag when available.
      - name: has_lifecycle_recheck
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

  - name: int_wremotely__job_search_facets
    description: >
      Candidate-grain normalized employment arrays and reviewed search tags.
      Raw employment values remain available in upstream current facts.
    columns:
      - name: job_id
        data_tests:
          - unique
          - not_null
      - name: employment_types
        data_tests:
          - not_null
      - name: search_tags
        data_tests:
          - not_null
