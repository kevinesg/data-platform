      - input: ref('wremotely__country_group_aliases')
        rows:
          - {country_group_code: EU, alias: European Union}
    expect:
      rows:
        - {candidate_id: candidate-virginia, matched_country_code: null, matched_country_group_code: null, match_source: UNMATCHED_RESTRICTIVE_EVIDENCE}
        - {candidate_id: candidate-us-name, matched_country_code: US, matched_country_group_code: null, match_source: COUNTRY_TEXT_ALIAS}
        - {candidate_id: candidate-ca-code, matched_country_code: null, matched_country_group_code: null, match_source: UNMATCHED_RESTRICTIVE_EVIDENCE}
        - {candidate_id: candidate-tx-code, matched_country_code: US, matched_country_group_code: null, match_source: COUNTRY_SUBDIVISION_TEXT_ALIAS}
