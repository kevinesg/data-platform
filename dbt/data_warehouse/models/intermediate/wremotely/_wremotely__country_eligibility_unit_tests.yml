  - name: test_country_alias_conflicting_with_structured_location_context
    description: >
      Uses structured address-country context to keep a locality containing a
      country alias from becoming applicant-country eligibility.
    model: int_wremotely__country_eligibility_evidence
    given:
      - input: ref('stg_wremotely__country_eligibility_extractions')
        rows:
          - candidate_id: candidate-jersey-city
            stage_run_id: stage-1
            classification_run_id: classification-1
            source_record_index: 1
            source_evidence_index: 1
            country_field_role: NORMALIZED_TEXT
            raw_country_eligibility_scope: SPECIFIC
            raw_value: Candidates based in Raleigh or Jersey City
            json_path: null
            can_restrict: true
          - candidate_id: candidate-jersey-city
            stage_run_id: stage-1
            classification_run_id: classification-1
            source_record_index: 1
            source_evidence_index: 2
            country_field_role: JOB_LOCATION
            raw_country_eligibility_scope: UNKNOWN
            raw_value: Jersey City
            json_path: $.documents[0].jobLocation.address.addressLocality
            can_restrict: false
          - candidate_id: candidate-jersey-city
            stage_run_id: stage-1
            classification_run_id: classification-1
            source_record_index: 1
            source_evidence_index: 3
            country_field_role: JOB_LOCATION
            raw_country_eligibility_scope: UNKNOWN
