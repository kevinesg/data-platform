version: 2

unit_tests:
  - name: test_country_and_subdivision_text_disambiguation
    description: >
      Maps subdivision phrases containing conflicting country aliases to their
      parent country, requires parent-country context for other subdivision
      names, requires complete subdivision codes, preserves separate country
      mentions, and does not reinterpret country names as subdivisions.
    model: int_wremotely__country_eligibility_evidence
    given:
      - input: ref('stg_wremotely__country_eligibility_extractions')
        rows:
          - candidate_id: candidate-new-jersey
            stage_run_id: stage-1
            classification_run_id: classification-1
            source_record_index: 1
            source_evidence_index: 1
            country_field_role: NORMALIZED_TEXT
            raw_country_eligibility_scope: SPECIFIC
            raw_value: Remote - New Jersey
            json_path: null
            can_restrict: true
          - candidate_id: candidate-new-mexico
            stage_run_id: stage-1
            classification_run_id: classification-1
            source_record_index: 2
            source_evidence_index: 1
            country_field_role: NORMALIZED_TEXT
            raw_country_eligibility_scope: SPECIFIC
            raw_value: Remote - New Mexico
            json_path: null
            can_restrict: true
          - candidate_id: candidate-mexico
            stage_run_id: stage-1
            classification_run_id: classification-1
            source_record_index: 3
            source_evidence_index: 1
            country_field_role: NORMALIZED_TEXT
            raw_country_eligibility_scope: SPECIFIC
            raw_value: Remote in Mexico
            json_path: null
            can_restrict: true
          - candidate_id: candidate-ireland
            stage_run_id: stage-1
            classification_run_id: classification-1
            source_record_index: 4
            source_evidence_index: 1
            country_field_role: NORMALIZED_TEXT
            raw_country_eligibility_scope: SPECIFIC
            raw_value: Candidates can be located in Ireland or Northern Ireland
            json_path: null
            can_restrict: true
          - candidate_id: candidate-luxembourg
            stage_run_id: stage-1
            classification_run_id: classification-1
            source_record_index: 5
            source_evidence_index: 1
            country_field_role: NORMALIZED_TEXT
            raw_country_eligibility_scope: SPECIFIC
            raw_value: Remote - Luxembourg
            json_path: null
            can_restrict: true
          - candidate_id: candidate-ontario
            stage_run_id: stage-1
            classification_run_id: classification-1
            source_record_index: 12
            source_evidence_index: 1
            country_field_role: NORMALIZED_TEXT
            raw_country_eligibility_scope: SPECIFIC
            raw_value: Remote - Ontario, Canada
            json_path: null
            can_restrict: true
      - input: ref('int_wremotely__latest_classifications')
        rows:
          - {candidate_id: candidate-new-jersey, latest_classification_stage_run_id: stage-1, latest_classification_run_id: classification-1}
          - {candidate_id: candidate-new-mexico, latest_classification_stage_run_id: stage-1, latest_classification_run_id: classification-1}
          - {candidate_id: candidate-mexico, latest_classification_stage_run_id: stage-1, latest_classification_run_id: classification-1}
          - {candidate_id: candidate-ireland, latest_classification_stage_run_id: stage-1, latest_classification_run_id: classification-1}
          - {candidate_id: candidate-luxembourg, latest_classification_stage_run_id: stage-1, latest_classification_run_id: classification-1}
          - {candidate_id: candidate-ontario, latest_classification_stage_run_id: stage-1, latest_classification_run_id: classification-1}
      - input: ref('wremotely__countries')
        rows:
          - {country_code: BE, country_name: Belgium, alpha_3_code: BEL}
          - {country_code: CA, country_name: Canada, alpha_3_code: CAN}
          - {country_code: GB, country_name: United Kingdom, alpha_3_code: GBR}
          - {country_code: IE, country_name: Ireland, alpha_3_code: IRL}
          - {country_code: JE, country_name: Jersey, alpha_3_code: JEY}
          - {country_code: LU, country_name: Luxembourg, alpha_3_code: LUX}
          - {country_code: MX, country_name: Mexico, alpha_3_code: MEX}
          - {country_code: US, country_name: United States, alpha_3_code: USA}
      - input: ref('wremotely__country_aliases')
        rows:
          - {country_code: US, alias: United States of America, match_kind: phrase}
      - input: ref('wremotely__country_cldr_aliases')
        rows:
          - {country_code: CZ, alias: Czech Republic, match_kind: phrase}
      - input: ref('wremotely__country_subdivisions')
        rows:
          - {subdivision_code: BE-WLX, country_code: BE, subdivision_name: Luxembourg}
          - {subdivision_code: CA-ON, country_code: CA, subdivision_name: Ontario}
          - {subdivision_code: GB-NIR, country_code: GB, subdivision_name: Northern Ireland}
          - {subdivision_code: US-NJ, country_code: US, subdivision_name: New Jersey}
          - {subdivision_code: US-NM, country_code: US, subdivision_name: New Mexico}
      - input: ref('wremotely__country_group_aliases')
        rows:
          - {country_group_code: EU, alias: European Union}
    expect:
      rows:
        - {candidate_id: candidate-new-jersey, matched_country_code: US, matched_country_group_code: null, match_source: COUNTRY_SUBDIVISION_TEXT_ALIAS}
        - {candidate_id: candidate-new-mexico, matched_country_code: US, matched_country_group_code: null, match_source: COUNTRY_SUBDIVISION_TEXT_ALIAS}
        - {candidate_id: candidate-mexico, matched_country_code: MX, matched_country_group_code: null, match_source: COUNTRY_TEXT_ALIAS}
        - {candidate_id: candidate-ireland, matched_country_code: GB, matched_country_group_code: null, match_source: COUNTRY_SUBDIVISION_TEXT_ALIAS}
        - {candidate_id: candidate-ireland, matched_country_code: IE, matched_country_group_code: null, match_source: COUNTRY_TEXT_ALIAS}
        - {candidate_id: candidate-luxembourg, matched_country_code: LU, matched_country_group_code: null, match_source: COUNTRY_TEXT_ALIAS}
        - {candidate_id: candidate-ontario, matched_country_code: CA, matched_country_group_code: null, match_source: COUNTRY_SUBDIVISION_TEXT_ALIAS}

