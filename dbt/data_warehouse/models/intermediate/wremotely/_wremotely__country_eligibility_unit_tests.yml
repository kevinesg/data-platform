  - name: test_onsite_composite_locality_can_establish_default_country
    description: >
      A composite JSON-LD locality may establish an onsite default country
      through a validated text alias, while the ETL leaves city-only values
      unknown rather than inferring a country.
    model: int_wremotely__country_eligibility_evidence
    given:
      - input: ref('stg_wremotely__country_eligibility_extractions')
        rows:
          - candidate_id: candidate-onsite-composite-locality
            stage_run_id: stage-1
            classification_run_id: classification-1
            source_record_index: 1
            source_evidence_index: 1
            country_field_role: JOB_LOCATION
            raw_country_eligibility_scope: RESTRICTED
            raw_value: Manila, Philippines
            json_path: $.documents[0].jobLocation.address.addressLocality
            can_restrict: true
          - candidate_id: candidate-onsite-city-only
            stage_run_id: stage-1
            classification_run_id: classification-1
            source_record_index: 1
            source_evidence_index: 1
            country_field_role: JOB_LOCATION
            raw_country_eligibility_scope: UNKNOWN
            raw_value: Manila
            json_path: $.documents[0].jobLocation.address.addressLocality
            can_restrict: false
      - input: ref('int_wremotely__latest_classifications')
        rows:
          - {candidate_id: candidate-onsite-composite-locality, latest_classification_stage_run_id: stage-1, latest_classification_run_id: classification-1, latest_remote_scope: ONSITE}
          - {candidate_id: candidate-onsite-city-only, latest_classification_stage_run_id: stage-1, latest_classification_run_id: classification-1, latest_remote_scope: ONSITE}
      - input: ref('wremotely__countries')
        rows:
          - {country_code: PH, country_name: Philippines, alpha_3_code: PHL}
      - input: ref('wremotely__country_aliases')
        rows:
          - {country_code: PH, alias: Philippines, match_kind: phrase}
      - input: ref('wremotely__location_country_aliases')
        rows: []
      - input: ref('wremotely__global_location_aliases')
        rows: []
      - input: ref('wremotely__country_cldr_aliases')
        rows: []
      - input: ref('wremotely__country_subdivisions')
        rows: []
      - input: ref('wremotely__country_group_aliases')
        rows: []
    expect:
      rows:
        - {candidate_id: candidate-onsite-composite-locality, evidence_direction: INCLUDED, matched_country_code: PH, match_source: COUNTRY_TEXT_ALIAS}
        - {candidate_id: candidate-onsite-city-only, evidence_direction: UNKNOWN, matched_country_code: null, match_source: UNKNOWN_OR_INVALID}

  - name: test_reviewed_platform_location_roles_are_consumed
    description: >
      Consumes explicitly restricting canonical and legacy ATS work-location
      roles, accepts mappable generic onsite evidence, preserves the narrow
      Lever and Workday JSON-LD exceptions, and keeps unrelated or unflagged
      remote physical office locations non-restricting.
    model: int_wremotely__country_eligibility_evidence
    given:
      - input: ref('stg_wremotely__country_eligibility_extractions')
        format: sql
        rows: |
          SELECT
              candidate_id
              , 'stage-1' AS stage_run_id
              , 'classification-1' AS classification_run_id
              , source_record_index
              , 1 AS source_evidence_index
              , country_field_role
              , country_field_source_system
              , source_platform_guess
              , raw_country_eligibility_scope
              , raw_value
              , json_path
              , CAST(NULL AS STRING) AS rule
              , can_restrict
          FROM UNNEST([
              STRUCT('canonical-workable' AS candidate_id, 1 AS source_record_index, 'PLATFORM_JOB_LOCATION' AS country_field_role, 'WORKABLE_WIDGET' AS country_field_source_system, 'workable' AS source_platform_guess, 'RESTRICTED' AS raw_country_eligibility_scope, 'Singapore' AS raw_value, CAST(NULL AS STRING) AS json_path, TRUE AS can_restrict)
              , STRUCT('legacy-smartrecruiters', 2, 'SMARTRECRUITERS_MICRODATA', 'SMARTRECRUITERS_MICRODATA', 'smartrecruiters', 'RESTRICTED', 'United States', CAST(NULL AS STRING), TRUE)
              , STRUCT('legacy-bamboohr', 3, 'BAMBOOHR_CAREERS_LIST', 'BAMBOOHR_CAREERS_LIST', 'bamboohr', 'RESTRICTED', 'Canada', CAST(NULL AS STRING), TRUE)
              , STRUCT('jobvite-nonrestricting', 4, 'JOBVITE_PRELOADED_DATA', 'JOBVITE_PRELOADED_DATA', 'jobvite', 'UNKNOWN', 'United States', CAST(NULL AS STRING), FALSE)
              , STRUCT('generic-remote-office', 5, 'JOB_LOCATION', 'JSONLD', 'greenhouse', 'RESTRICTED', 'United States', '$.documents[0].jobLocation.address.addressCountry', TRUE)
              , STRUCT('lever-remote-location', 6, 'JOB_LOCATION', 'JSONLD', 'lever', 'RESTRICTED', 'United States', '$.documents[0].jobLocation.address.addressCountry', TRUE)
              , STRUCT('generic-onsite-unflagged', 7, 'JOB_LOCATION', 'JSONLD', 'greenhouse', 'UNKNOWN', 'Canada', '$.documents[0].jobLocation.address.addressCountry', FALSE)
              , STRUCT('lever-hybrid-location', 8, 'JOB_LOCATION', 'JSONLD', 'lever', 'RESTRICTED', 'United States', '$.documents[0].jobLocation.address.addressCountry', TRUE)
              , STRUCT('workday-remote-location', 9, 'JOB_LOCATION', 'JSONLD', 'workday', 'RESTRICTED', 'Germany', '$.documents[0].jobLocation.address.addressCountry', TRUE)
              , STRUCT('workday-remote-unflagged', 10, 'JOB_LOCATION', 'JSONLD', 'workday', 'UNKNOWN', 'Germany', '$.documents[0].jobLocation.address.addressCountry', FALSE)
              , STRUCT('workday-hybrid-location', 11, 'JOB_LOCATION', 'JSONLD', 'workday', 'RESTRICTED', 'Canada', '$.documents[0].jobLocation.address.addressCountry', TRUE)
              , STRUCT('jobvite-new-york', 12, 'PLATFORM_JOB_LOCATION', 'JOBVITE_PRELOADED_DATA', 'jobvite', 'RESTRICTED', 'New York, NY', CAST(NULL AS STRING), TRUE)
              , STRUCT('lever-san-francisco', 13, 'JOB_LOCATION', 'JSONLD', 'lever', 'RESTRICTED', 'San Francisco', CAST(NULL AS STRING), TRUE)
              , STRUCT('unreviewed-city-platform', 14, 'PLATFORM_JOB_LOCATION', 'WORKABLE_WIDGET', 'workable', 'RESTRICTED', 'San Francisco', CAST(NULL AS STRING), TRUE)
              , STRUCT('standalone-ny', 15, 'PLATFORM_JOB_LOCATION', 'JOBVITE_PRELOADED_DATA', 'jobvite', 'RESTRICTED', 'NY', CAST(NULL AS STRING), TRUE)
              , STRUCT('terminal-subdivision', 16, 'PLATFORM_JOB_LOCATION', 'BAMBOOHR_CAREERS_LIST', 'bamboohr', 'RESTRICTED', 'Carrollton, Texas', CAST(NULL AS STRING), TRUE)
              , STRUCT('country-colliding-subdivision', 17, 'PLATFORM_JOB_LOCATION', 'BAMBOOHR_CAREERS_LIST', 'bamboohr', 'RESTRICTED', 'Macon, Georgia', CAST(NULL AS STRING), TRUE)
              , STRUCT('bare-subdivision-name', 18, 'PLATFORM_JOB_LOCATION', 'BAMBOOHR_CAREERS_LIST', 'bamboohr', 'RESTRICTED', 'Texas', CAST(NULL AS STRING), TRUE)
              , STRUCT('reviewed-global-location', 19, 'PLATFORM_JOB_LOCATION', 'ASHBY_POSTING_API', 'ashby', 'RESTRICTED', 'Remote - Global', CAST(NULL AS STRING), TRUE)
          ])
      - input: ref('int_wremotely__latest_classifications')
        format: sql
        rows: |
          SELECT
              candidate_id
              , 'stage-1' AS latest_classification_stage_run_id
              , 'classification-1' AS latest_classification_run_id
              , latest_remote_scope
          FROM UNNEST([
              STRUCT('canonical-workable' AS candidate_id, 'REMOTE' AS latest_remote_scope)
              , STRUCT('legacy-smartrecruiters', 'ONSITE')
              , STRUCT('legacy-bamboohr', 'HYBRID')
              , STRUCT('jobvite-nonrestricting', 'REMOTE')
              , STRUCT('generic-remote-office', 'REMOTE')
              , STRUCT('lever-remote-location', 'REMOTE')
              , STRUCT('generic-onsite-unflagged', 'ONSITE')
              , STRUCT('lever-hybrid-location', 'HYBRID')
              , STRUCT('workday-remote-location', 'REMOTE')
              , STRUCT('workday-remote-unflagged', 'REMOTE')
              , STRUCT('workday-hybrid-location', 'HYBRID')
              , STRUCT('jobvite-new-york', 'ONSITE')
              , STRUCT('lever-san-francisco', 'REMOTE')
              , STRUCT('unreviewed-city-platform', 'ONSITE')
              , STRUCT('standalone-ny', 'ONSITE')
              , STRUCT('terminal-subdivision', 'ONSITE')
              , STRUCT('country-colliding-subdivision', 'ONSITE')
              , STRUCT('bare-subdivision-name', 'ONSITE')
              , STRUCT('reviewed-global-location', 'REMOTE')
          ])
      - input: ref('wremotely__countries')
        rows:
          - {country_code: CA, country_name: Canada, alpha_3_code: CAN}
          - {country_code: DE, country_name: Germany, alpha_3_code: DEU}
          - {country_code: GE, country_name: Georgia, alpha_3_code: GEO}
          - {country_code: SG, country_name: Singapore, alpha_3_code: SGP}
          - {country_code: US, country_name: United States, alpha_3_code: USA}
      - input: ref('wremotely__country_aliases')
        rows: []
      - input: ref('wremotely__location_country_aliases')
        rows:
          - {country_code: US, location_alias: 'New York, NY', source_platform_guess: null}
          - {country_code: US, location_alias: San Francisco, source_platform_guess: lever}
      - input: ref('wremotely__global_location_aliases')
        rows:
          - {location_alias: Remote - Global, source_platform_guess: ashby}
      - input: ref('wremotely__country_cldr_aliases')
        rows: []
      - input: ref('wremotely__country_subdivisions')
        rows:
          - {subdivision_code: US-GA, country_code: US, subdivision_name: Georgia}
          - {subdivision_code: US-TX, country_code: US, subdivision_name: Texas}
      - input: ref('wremotely__country_group_aliases')
        rows: []
    expect:
      rows:
        - {candidate_id: canonical-workable, evidence_direction: INCLUDED, matched_country_code: SG, match_source: COUNTRY_TEXT_ALIAS}
        - {candidate_id: legacy-smartrecruiters, evidence_direction: INCLUDED, matched_country_code: US, match_source: COUNTRY_TEXT_ALIAS}
        - {candidate_id: legacy-bamboohr, evidence_direction: INCLUDED, matched_country_code: CA, match_source: COUNTRY_TEXT_ALIAS}
        - {candidate_id: jobvite-nonrestricting, evidence_direction: UNKNOWN, matched_country_code: null, match_source: UNKNOWN_OR_INVALID}
        - {candidate_id: generic-remote-office, evidence_direction: UNKNOWN, matched_country_code: null, match_source: UNKNOWN_OR_INVALID}
        - {candidate_id: lever-remote-location, evidence_direction: INCLUDED, matched_country_code: US, match_source: ATOMIC_COUNTRY_ALIAS}
        - {candidate_id: generic-onsite-unflagged, evidence_direction: INCLUDED, matched_country_code: CA, match_source: ATOMIC_COUNTRY_ALIAS}
        - {candidate_id: lever-hybrid-location, evidence_direction: INCLUDED, matched_country_code: US, match_source: ATOMIC_COUNTRY_ALIAS}
        - {candidate_id: workday-remote-location, evidence_direction: INCLUDED, matched_country_code: DE, match_source: ATOMIC_COUNTRY_ALIAS}
        - {candidate_id: workday-remote-unflagged, evidence_direction: UNKNOWN, matched_country_code: null, match_source: UNKNOWN_OR_INVALID}
        - {candidate_id: workday-hybrid-location, evidence_direction: INCLUDED, matched_country_code: CA, match_source: ATOMIC_COUNTRY_ALIAS}
        - {candidate_id: jobvite-new-york, evidence_direction: INCLUDED, matched_country_code: US, match_source: REVIEWED_LOCATION_COUNTRY_ALIAS}
        - {candidate_id: lever-san-francisco, evidence_direction: INCLUDED, matched_country_code: US, match_source: REVIEWED_LOCATION_COUNTRY_ALIAS}
        - {candidate_id: unreviewed-city-platform, evidence_direction: INCLUDED, matched_country_code: null, match_source: UNMATCHED_RESTRICTIVE_EVIDENCE}
        - {candidate_id: standalone-ny, evidence_direction: INCLUDED, matched_country_code: null, match_source: UNMATCHED_RESTRICTIVE_EVIDENCE}
        - {candidate_id: terminal-subdivision, evidence_direction: INCLUDED, matched_country_code: US, match_source: COUNTRY_SUBDIVISION_TEXT_ALIAS}
        - {candidate_id: country-colliding-subdivision, evidence_direction: INCLUDED, matched_country_code: null, match_source: AMBIGUOUS_COUNTRY_ALIAS}
        - {candidate_id: bare-subdivision-name, evidence_direction: INCLUDED, matched_country_code: null, match_source: UNMATCHED_RESTRICTIVE_EVIDENCE}
        - {candidate_id: reviewed-global-location, evidence_direction: GLOBAL, matched_country_code: null, match_source: REVIEWED_GLOBAL_LOCATION_ALIAS}
