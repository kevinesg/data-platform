        - {candidate_id: candidate-eu, matched_country_code: null, matched_country_group_code: EU, match_source: ATOMIC_COUNTRY_GROUP_ALIAS}

  - name: test_location_label_confidence_controls
    description: >
      Keeps recognized heuristic location labels restrictive while preserving
      unmatched labels as non-blocking unknown evidence for QA.
    model: int_wremotely__country_eligibility_evidence
    given:
      - input: ref('stg_wremotely__country_eligibility_extractions')
        rows:
          - candidate_id: candidate-unmatched-location-label
            stage_run_id: stage-1
            classification_run_id: classification-1
            source_record_index: 1
            source_evidence_index: 1
            country_field_role: NORMALIZED_TEXT
            raw_country_eligibility_scope: SPECIFIC
            raw_value: Full-Time
            json_path: null
            rule: location_shaped_remote_label
            can_restrict: true
          - candidate_id: candidate-matched-location-label
            stage_run_id: stage-1
            classification_run_id: classification-1
            source_record_index: 2
            source_evidence_index: 1
            country_field_role: NORMALIZED_TEXT
            raw_country_eligibility_scope: SPECIFIC
            raw_value: United States
            json_path: null
            rule: location_shaped_remote_label
            can_restrict: true
      - input: ref('int_wremotely__latest_classifications')
        rows:
          - {candidate_id: candidate-unmatched-location-label, latest_classification_stage_run_id: stage-1, latest_classification_run_id: classification-1}
          - {candidate_id: candidate-matched-location-label, latest_classification_stage_run_id: stage-1, latest_classification_run_id: classification-1}
      - input: ref('wremotely__countries')
        rows:
          - {country_code: US, country_name: United States, alpha_3_code: USA}
      - input: ref('wremotely__country_aliases')
        rows:
          - {country_code: US, alias: United States of America, match_kind: phrase}
      - input: ref('wremotely__country_cldr_aliases')
        rows:
          - {country_code: US, alias: U.S., match_kind: phrase}
      - input: ref('wremotely__country_subdivisions')
        rows:
          - {subdivision_code: US-TX, country_code: US, subdivision_name: Texas}
      - input: ref('wremotely__country_group_aliases')
        rows:
          - {country_group_code: EU, alias: European Union}
    expect:
      rows:
        - {candidate_id: candidate-unmatched-location-label, evidence_direction: UNKNOWN, matched_country_code: null, matched_country_group_code: null, match_source: UNMATCHED_LOCATION_LABEL}
        - {candidate_id: candidate-matched-location-label, evidence_direction: INCLUDED, matched_country_code: US, matched_country_group_code: null, match_source: COUNTRY_TEXT_ALIAS}

