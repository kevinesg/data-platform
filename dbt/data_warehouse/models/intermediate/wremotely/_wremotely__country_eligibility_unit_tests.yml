          - {candidate_id: candidate-ca-code, latest_classification_stage_run_id: stage-1, latest_classification_run_id: classification-1}
          - {candidate_id: candidate-tx-code, latest_classification_stage_run_id: stage-1, latest_classification_run_id: classification-1}
          - {candidate_id: candidate-czech, latest_classification_stage_run_id: stage-1, latest_classification_run_id: classification-1}
          - {candidate_id: candidate-eu, latest_classification_stage_run_id: stage-1, latest_classification_run_id: classification-1}
      - input: ref('wremotely__countries')
        rows:
          - {country_code: CA, country_name: Canada, alpha_3_code: CAN}
          - {country_code: CZ, country_name: Czechia, alpha_3_code: CZE}
