version: 2

models:
  - name: stg_wremotely__job_facts
    description: First ClickHouse-compatible staging projection over stable raw job facts.
    columns:
      - name: ingest_key
        tests:
          - not_null
          - unique
      - name: candidate_id
        tests:
          - not_null
      - name: raw_payload
        tests:
          - not_null
  - name: stg_wremotely__selected_job_urls
    description: ClickHouse-compatible staging projection over selected job URLs.
    columns:
      - name: ingest_key
        tests:
          - not_null
          - unique
      - name: candidate_id
        tests:
          - not_null
      - name: url
        tests:
          - not_null
      - name: raw_payload
        tests:
          - not_null
  - name: stg_wremotely__extraction_page_results
    description: ClickHouse-compatible staging projection over extracted pages.
    columns:
      - name: ingest_key
        tests:
          - not_null
          - unique
      - name: candidate_id
        tests:
          - not_null
      - name: raw_payload
        tests:
          - not_null
  - name: stg_wremotely__classification_classifications
    description: ClickHouse-compatible staging projection over classifications.
    columns:
      - name: ingest_key
        tests:
          - not_null
          - unique
      - name: candidate_id
        tests:
          - not_null
      - name: raw_payload
        tests:
          - not_null
  - name: stg_wremotely__country_eligibility_extractions
    description: ClickHouse-compatible staging projection over country evidence.
    columns:
      - name: ingest_key
        tests:
          - not_null
          - unique
      - name: candidate_id
        tests:
          - not_null
      - name: raw_payload
        tests:
          - not_null
  - name: stg_wremotely__recheck_lifecycle_results
    description: ClickHouse-compatible staging projection over lifecycle observations.
    columns:
      - name: ingest_key
        tests:
          - not_null
          - unique
      - name: candidate_id
        tests:
          - not_null
      - name: lifecycle_status
        tests:
          - accepted_values:
              arguments:
                values: [ACTIVE, CLOSED, REACHABLE, TERMINAL, UNKNOWN]
      - name: raw_payload
        tests:
          - not_null
  - name: stg_wremotely__job_url_selection_results
    description: ClickHouse-compatible staging projection over selection decisions.
    columns:
      - name: ingest_key
        tests:
          - not_null
          - unique
      - name: candidate_id
        tests:
          - not_null
      - name: raw_payload
        tests:
          - not_null
  - name: stg_wremotely__publication_review
    description: Latest manual publication-review status per candidate.
    columns:
      - name: candidate_id
        tests:
          - not_null
          - unique
      - name: review_status
        tests:
          - accepted_values:
              arguments:
                values: [pending, held, released]
