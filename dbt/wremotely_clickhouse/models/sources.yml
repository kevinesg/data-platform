version: 2

sources:
  - name: wremotely
    schema: "{{ env_var('WREMOTELY_CLICKHOUSE_DATABASE', 'wremotely_dev') }}"
    description: Stable ClickHouse raw relations written by the private ETL loader.
    tables:
      - name: job_facts
        identifier: wremotely__job_facts
        description: One immutable raw envelope per extracted job-facts record.
        columns:
          - name: ingest_key
            tests:
              - not_null
              - unique
          - name: payload
            tests:
              - not_null
      - name: selected_job_urls
        identifier: wremotely__selected_job_urls
        description: Selected job URLs emitted by the private ETL selection step.
        columns:
          - name: ingest_key
            tests:
              - not_null
              - unique
          - name: payload
            tests:
              - not_null
      - name: extraction_page_results
        identifier: wremotely__extraction_page_results
        description: Page extraction results emitted by the private ETL extraction step.
        columns:
          - name: ingest_key
            tests:
              - not_null
              - unique
          - name: payload
            tests:
              - not_null
      - name: classification_classifications
        identifier: wremotely__classification_classifications
        description: Classification results emitted by the private ETL classifier.
        columns:
          - name: ingest_key
            tests:
              - not_null
              - unique
          - name: payload
            tests:
              - not_null
      - name: country_eligibility_extractions
        identifier: wremotely__country_eligibility_extractions
        description: Country-eligibility evidence emitted by the private ETL extractor.
        columns:
          - name: ingest_key
            tests:
              - not_null
              - unique
          - name: payload
            tests:
              - not_null
      - name: recheck_lifecycle_results
        identifier: wremotely__recheck_lifecycle_results
        description: Lifecycle observations emitted by the private ETL recheck step.
        columns:
          - name: ingest_key
            tests:
              - not_null
              - unique
          - name: payload
            tests:
              - not_null
      - name: job_url_selection_results
        identifier: wremotely__job_url_selection_results
        description: URL selection decisions emitted by the private ETL selector.
        columns:
          - name: ingest_key
            tests:
              - not_null
              - unique
          - name: payload
            tests:
              - not_null
      - name: publication_review
        identifier: wremotely__publication_review
        description: Versioned manual publication-review candidates and decisions.
        columns:
          - name: candidate_id
            tests:
              - not_null
