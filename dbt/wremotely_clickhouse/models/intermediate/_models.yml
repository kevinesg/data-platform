version: 2

models:
  - name: int_wremotely__latest_job_facts
    description: Latest job-facts envelope per candidate from immutable raw history.
    columns:
      - name: candidate_id
        tests:
          - not_null
          - unique
      - name: raw_payload
        tests:
          - not_null
      - name: url
        tests: [not_null]
      - name: latest_job_fact_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [EXTRACTED, SKIPPED_EXTRACTION_FAILED]
      - name: latest_job_fact_extracted_at
        tests: [not_null]
      - name: latest_job_fact_stage_run_id
        tests: [not_null]
      - name: latest_job_facts_run_id
        tests: [not_null]
      - name: source_updated_at
        tests: [not_null]
      - name: dbt_updated_at
        tests: [not_null]
  - name: int_wremotely__latest_extraction_page_results
    description: Latest extraction result per candidate from immutable raw history.
    columns:
      - name: candidate_id
        tests:
          - not_null
          - unique
      - name: raw_payload
        tests:
          - not_null
      - name: url
        tests: [not_null]
      - name: latest_page_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [SUCCEEDED, FAILED]
      - name: latest_extraction_stage_run_id
        tests: [not_null]
      - name: latest_extraction_run_id
        tests: [not_null]
      - name: source_updated_at
        tests: [not_null]
      - name: dbt_updated_at
        tests: [not_null]
  - name: int_wremotely__latest_classifications
    description: Latest classification result per candidate from immutable raw history.
    columns:
      - name: candidate_id
        tests:
          - not_null
          - unique
      - name: raw_payload
        tests:
          - not_null
      - name: url
        tests: [not_null]
      - name: latest_classification_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [CLASSIFIED, NEEDS_REVIEW, QUARANTINED]
      - name: latest_job_posting_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [JOB, NON_JOB, UNKNOWN]
      - name: latest_remote_scope
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [REMOTE, HYBRID, ONSITE, UNKNOWN]
      - name: latest_country_eligibility_scope
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [GLOBAL, GLOBAL_EXCEPT, SPECIFIC, UNKNOWN]
      - name: latest_serving_decision
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [PUBLISHABLE, NOT_PUBLISHABLE, NEEDS_REVIEW, QUARANTINE]
      - name: latest_classification_stage_run_id
        tests: [not_null]
      - name: latest_classification_run_id
        tests: [not_null]
      - name: source_updated_at
        tests: [not_null]
      - name: dbt_updated_at
        tests: [not_null]
  - name: int_wremotely__latest_lifecycle_rechecks
    description: Latest lifecycle observation per candidate with prior status for terminal confirmation.
    columns:
      - name: candidate_id
        tests:
          - not_null
          - unique
      - name: latest_lifecycle_status
        tests:
          - accepted_values:
              arguments:
                values: [ACTIVE, CLOSED, REACHABLE, TERMINAL, UNKNOWN]
      - name: latest_lifecycle_checked_at
        tests:
          - not_null
  - name: int_wremotely__latest_selected_job_urls
    description: Latest selected URL per candidate with selection evidence context.
    columns:
      - name: candidate_id
        tests:
          - not_null
          - unique
      - name: raw_payload
        tests:
          - not_null
      - name: url
        tests: [not_null]
      - name: latest_selected_at
        tests: [not_null]
      - name: latest_selection_stage_run_id
        tests: [not_null]
      - name: latest_selection_run_id
        tests: [not_null]
      - name: source_updated_at
        tests: [not_null]
      - name: dbt_updated_at
        tests: [not_null]
  - name: int_wremotely__candidate_job_titles
    description: Trustworthy bounded title evidence selected per candidate.
    columns:
      - name: candidate_id
        tests:
          - not_null
          - unique
      - name: title_source
        tests:
          - accepted_values:
              arguments:
                values:
                  - JSONLD
                  - HTML_META_OG_TITLE
                  - HTML_META_TWITTER_TITLE
                  - LINK_TITLE_CANDIDATE
                  - LEGACY_BOUNDED_LINK_TEXT
  - name: int_wremotely__country_eligibility_inputs
    description: Latest-classification-aligned country evidence prepared for downstream alias resolution.
    columns:
      - name: evidence_id
        tests:
          - not_null
          - unique
      - name: candidate_id
        tests:
          - not_null
      - name: evidence_direction
        tests:
          - accepted_values:
              arguments:
                values: [GLOBAL, INCLUDED, EXCLUDED, UNKNOWN]
      - name: country_match_mode
        tests:
          - accepted_values:
              arguments:
                values: [ATOMIC, TEXT, NONE]
  - name: int_wremotely__country_eligibility_exact_matches
    description: Exact normalized country, group, reviewed-location, and subdivision matches for prepared evidence.
    columns:
      - name: match_id
        tests:
          - not_null
          - unique
      - name: evidence_id
        tests:
          - not_null
      - name: match_source
        tests:
          - accepted_values:
              arguments:
                values:
                  - ATOMIC_COUNTRY_ALIAS
                  - COUNTRY_TEXT_ALIAS
                  - ATOMIC_COUNTRY_GROUP_ALIAS
                  - COUNTRY_GROUP_TEXT_ALIAS
                  - REVIEWED_LOCATION_COUNTRY_ALIAS
                  - ATOMIC_COUNTRY_SUBDIVISION_ALIAS
                  - COUNTRY_SUBDIVISION_TEXT_ALIAS
      - name: match_status
        tests:
          - accepted_values:
              arguments:
                values: [MATCHED, AMBIGUOUS_COUNTRY_ALIAS]
  - name: int_wremotely__country_eligibility_combined_matches
    description: Persisted deduplicated union of the independent country-eligibility match stages.
    columns:
      - name: match_id
        tests:
          - not_null
          - unique
      - name: evidence_id
        tests: [not_null]
  - name: int_wremotely__country_eligibility_match_inputs
    description: Narrow country-evidence projection used by the independent exact-match stages.
  - name: int_wremotely__country_eligibility_atomic_matches
    description: Compatibility union of the independently materialized equality-based country, group, reviewed-location, and subdivision match stages.
  - name: int_wremotely__country_eligibility_atomic_country_matches
    description: Equality-based country-code, country-name, and country-alias matches for prepared evidence.
  - name: int_wremotely__country_eligibility_atomic_country_group_matches
    description: Equality-based country-group alias matches for atomic prepared evidence.
  - name: int_wremotely__country_eligibility_atomic_reviewed_location_matches
    description: Equality-based reviewed platform-location country matches for restricting evidence.
  - name: int_wremotely__country_eligibility_atomic_subdivision_matches
    description: Equality-based country-subdivision name and code matches for restricting evidence.
  - name: int_wremotely__country_eligibility_country_text_matches
    description: Bounded country-name phrase matches for prepared evidence.
  - name: int_wremotely__country_eligibility_country_group_text_matches
    description: Bounded country-group phrase matches for prepared evidence.
  - name: int_wremotely__country_eligibility_subdivision_text_matches
    description: Bounded subdivision phrase matches for restricting location evidence.
  - name: int_wremotely__candidate_country_eligibility
    description: Candidate-level country eligibility rollup with group expansion and ambiguity exclusion.
    columns:
      - name: candidate_id
        tests:
          - not_null
          - unique
      - name: validated_country_eligibility_scope
        tests:
          - accepted_values:
              arguments:
                values: [SPECIFIC, GLOBAL_EXCEPT, GLOBAL, UNKNOWN]
      - name: country_eligibility_evidence_count
        tests:
          - not_null
  - name: int_wremotely__job_country_eligibility
    description: Explicit eligible and excluded country bridge rows for candidate jobs.
    columns:
      - name: job_id
        tests:
          - not_null
      - name: country_code
        tests:
          - not_null
      - name: eligibility_status
        tests:
          - accepted_values:
              arguments:
                values: [ELIGIBLE, EXCLUDED]
      - name: country_eligibility_scope
        tests:
          - accepted_values:
              arguments:
              values: [SPECIFIC, GLOBAL_EXCEPT]
  - name: int_wremotely__current_candidate_facts
    description: Current candidate-grain join of latest selection, extraction, facts, classification, and country eligibility.
    columns:
      - name: candidate_id
        tests: [not_null, unique]
      - name: url
        tests: [not_null]
      - name: source_updated_at
        tests: [not_null]
      - name: dbt_updated_at
        tests: [not_null]
  - name: int_wremotely__job_publication_status
    description: Candidate publication gate over the ClickHouse current-facts contract.
    columns:
      - name: candidate_id
        tests: [not_null, unique]
      - name: publication_status
        tests:
          - accepted_values:
              arguments:
                values: [PUBLISHABLE, CLOSED, NOT_PUBLISHABLE]
      - name: publication_status_reason
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - PUBLICATION_READY
                  - NOT_JOB
                  - WORK_ARRANGEMENT
                  - COUNTRY_ELIGIBILITY_SCOPE
                  - COUNTRY_ELIGIBILITY_VALUES
                  - MISSING_TITLE
                  - UNSUPPORTED_LANGUAGE
                  - LIFECYCLE_CLOSED
                  - LIFECYCLE_TERMINAL_CONFIRMED
                  - EXPIRED_VALID_THROUGH
  - name: int_wremotely__publishable_job_facts
    description: Candidate rows accepted by the ClickHouse publication gate.
    columns:
      - name: job_id
        tests: [not_null, unique]
      - name: canonical_url
        tests: [not_null]
      - name: source_url
        tests: [not_null]
      - name: title
        tests: [not_null]
      - name: remote_scope
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [REMOTE, HYBRID, ONSITE]
      - name: country_eligibility_scope
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [GLOBAL, GLOBAL_EXCEPT, SPECIFIC]
      - name: is_deleted
        tests: [not_null]
      - name: source_updated_at
        tests: [not_null]
      - name: dbt_updated_at
        tests: [not_null]
  - name: int_wremotely__job_search_facets
    description: Candidate-grain normalized employment types and reviewed search tags.
    columns:
      - name: job_id
        tests: [not_null, unique]
      - name: employment_types
        tests: [not_null]
      - name: search_tags
        tests: [not_null]
